<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17221d" />
    <title>Polar Stream Mini</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="theme-bootstrap.js"></script>
    <script src="app.js" defer></script>
    <script src="battery-layout.js" type="module"></script>
    <script src="option-layout.js" type="module"></script>
  </head>
  <body data-kind="polar">
    <main class="mini-shell" aria-labelledby="product-name" data-tauri-drag-region>
      <article id="mini-node" class="patch-node live mini-node" tabindex="0" data-tauri-drag-region>
        <div class="node-surface" data-tauri-drag-region>
          <header data-tauri-drag-region>
            <div class="node-title" data-tauri-drag-region>
              <strong id="product-name" data-tauri-drag-region>Polar Stream Mini</strong>
              <span id="node-phase" data-tauri-drag-region>Initializing</span>
            </div>
            <mark id="node-kind" data-tauri-drag-region>MINI</mark>
            <div class="node-window-actions" data-tauri-drag-region>
              <button id="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle theme"><span class="window-icon theme" aria-hidden="true"></span></button>
              <button id="new-node-top" type="button" aria-label="Open new mini node" title="Open new mini node"><span class="window-icon add" aria-hidden="true"></span></button>
              <span id="device-battery" class="device-battery" role="img" aria-label="Device battery: disconnected" title="Device battery: disconnected" data-tauri-drag-region>
                <svg class="battery-icon" viewBox="0 0 24 14" aria-hidden="true" data-tauri-drag-region>
                  <rect x="1" y="1" width="19" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.5" />
                  <path d="M22 5v4" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                  <rect id="battery-fill" x="3" y="3" width="0" height="8" rx=".5" fill="currentColor" />
                </svg>
                <span id="battery-percent" aria-hidden="true" data-tauri-drag-region>—</span>
              </span>
              <button id="minimize-button" type="button" aria-label="Minimize" title="Minimize"><span class="window-icon minimize" aria-hidden="true"></span></button>
              <button id="close-button" class="close" type="button" aria-label="Close" title="Close"><span class="window-icon close" aria-hidden="true"></span></button>
            </div>
          </header>
          <section class="node-body" data-tauri-drag-region>
            <label class="field-label" for="stream-name">Stream name</label>
            <input id="stream-name" class="text-entry" autocomplete="off" spellcheck="false" />

            <div id="device-row" class="device-row" data-tauri-drag-region>
              <select id="device-select" aria-label="Device"></select>
              <button id="scan-button" type="button">Scan</button>
            </div>
            <div id="mock-source" class="mock-source-row" hidden data-tauri-drag-region>Synthetic Polar H10 · 130 Hz ECG · 200 Hz ACC</div>

            <div class="mini-option-row" data-tauri-drag-region>
              <label class="check-row hardware-only">
                <input id="autostart" type="checkbox" role="switch" disabled />
                <span>Start with PC</span>
              </label>
              <label class="check-row hardware-only">
                <input id="auto-connect" type="checkbox" role="switch" />
                <span>Automatic reconnect</span>
              </label>
              <div class="metric-row polar-only" data-tauri-drag-region>
                <button id="metrics-button" type="button">+ Add more metrics</button>
              </div>
            </div>

            <div id="signal-list" class="signal-list" role="group" aria-label="Polar LSL streams">
              <label class="signal-option" title="Raw ECG is always included when available"><input type="checkbox" value="raw_ecg" checked disabled /><span>rawECG</span></label>
              <label class="signal-option" title="Raw acceleration is always included when available"><input type="checkbox" value="raw_acc" checked disabled /><span>rawACC</span></label>
              <label class="signal-option" title="Heart rate is always included when available"><input type="checkbox" value="heart_rate" checked disabled /><span>heartRate</span></label>
              <label class="signal-option" title="RR intervals are always included when available"><input type="checkbox" value="rr_interval" checked disabled /><span>rrInterval</span></label>
              <label class="signal-option" title="Add one extra LSL stream with all Polar data and metrics; individual streams stay on"><input id="all-in-one" type="checkbox" value="allInOne" aria-description="Adds one extra combined LSL stream; individual streams stay on" /><span>All-in-one</span></label>
            </div>

            <dl class="readout" data-tauri-drag-region>
              <div data-tauri-drag-region><dt data-tauri-drag-region>Device</dt><dd id="device-status" data-tauri-drag-region>No device</dd></div>
              <div data-tauri-drag-region><dt data-tauri-drag-region>LSL</dt><dd id="lsl-status" data-tauri-drag-region>Off</dd></div>
              <div data-tauri-drag-region><dt data-tauri-drag-region>Samples</dt><dd id="sample-status" data-tauri-drag-region>0</dd></div>
            </dl>
          </section>
          <footer data-tauri-drag-region>
            <button id="connect-button" type="button">Connect</button>
            <button id="disconnect-button" type="button" disabled>Disconnect</button>
            <button id="mock-button" type="button" title="Open a separate synthetic Polar Stream Mini window">Open mock</button>
          </footer>
        </div>
        <span class="resize-grip north" data-resize-direction="North" aria-hidden="true"></span>
        <span class="resize-grip east" data-resize-direction="East" aria-hidden="true"></span>
        <span class="resize-grip south" data-resize-direction="South" aria-hidden="true"></span>
        <span class="resize-grip west" data-resize-direction="West" aria-hidden="true"></span>
        <span class="resize-grip north-east" data-resize-direction="NorthEast" aria-hidden="true"></span>
        <span class="resize-grip south-east" data-resize-direction="SouthEast" aria-hidden="true"></span>
        <span class="resize-grip south-west" data-resize-direction="SouthWest" aria-hidden="true"></span>
        <span class="resize-grip north-west" data-resize-direction="NorthWest" aria-hidden="true"></span>
      </article>

      <div id="context-menu" class="node-menu" role="menu" hidden>
        <button id="new-node-menu" type="button" role="menuitem">Open new mini node</button>
        <button id="mock-node-menu" type="button" role="menuitem">Create mock stream</button>
      </div>
    </main>

    <dialog id="metrics-dialog" class="node-source-dialog">
      <form method="dialog">
        <header class="dialog-header" data-tauri-drag-region>
          <div data-tauri-drag-region>
            <strong data-tauri-drag-region>More Polar metrics</strong>
            <span data-tauri-drag-region>Select additional LSL streams. Raw ECG, ACC, heart rate, and RR remain on; All-in-one is controlled in the mini window.</span>
          </div>
          <button id="metrics-close" value="cancel" type="submit" aria-label="Close">x</button>
        </header>
        <div id="metric-options" class="metric-options"></div>
        <footer>
          <button id="metrics-guide" class="metrics-guide" type="button">Full metric library</button>
          <div class="dialog-actions">
            <button value="cancel" type="submit">Close</button>
            <button id="reset-metrics" type="button">Reset metrics</button>
          </div>
        </footer>
      </form>
    </dialog>
  </body>
</html>
